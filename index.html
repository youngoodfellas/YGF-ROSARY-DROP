<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YGF Drop</title>
  <link rel="stylesheet" href="style.css">
</head>

<body class="lock-page">

  <div class="lock-bg-blur"></div>
  <div class="lock-bg-main"></div>
  <div class="lock-overlay"></div>

  <section class="lock-screen">
    <img src="YGF LOGO.PNG" class="lock-logo spinning-logo" alt="YGF Logo">

    <p class="small-title">YOUNG GOOD FELLAS</p>
    <h1>STAY MILITANT</h1>

    <div class="countdown" data-countdown></div>

    <form id="password-form">
      <input type="password" id="drop-password" placeholder="PASSWORD">
      <button type="submit">ENTER</button>
    </form>

    <p id="password-message"></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
