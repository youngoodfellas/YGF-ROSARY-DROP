<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Your Piece | YGF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="shop-header">
  <a href="index.html" class="brand-logo">
    <img src="YGF LOGO.PNG" alt="YGF Logo">
  </a>

  <nav>
    <a href="rosary.html">Rosary</a>
    <a href="cart.html">Cart <span id="cart-count">0</span></a>
  </nav>
</header>

<section class="checkout-section">
  <h1>SECURE YOUR PIECE</h1>

  <div class="checkout-grid">

    <form class="checkout-form" id="checkout-form">
      <h2>DETAILS</h2>

      <input type="text" placeholder="Full Name" required>
      <input type="email" placeholder="Email Address" required>
      <input type="text" placeholder="Phone Number" required>

      <h2>DELIVERY</h2>

      <input type="text" placeholder="Address Line 1" required>
      <input type="text" placeholder="City" required>
      <input type="text" placeholder="Postcode" required>
      <input type="text" placeholder="Country" required>

      <button type="submit" class="cart-btn">RESERVE ORDER</button>
      <p class="payment-note">Not everyone gets one.</p>
    </form>

    <div class="order-summary">
      <h2>ORDER SUMMARY</h2>
      <div id="checkout-items"></div>
      <p class="total-line">Total: £<span id="checkout-total">0</span></p>
      <p class="manual-note">All orders are processed manually. You will be contacted after checkout.</p>
    </div>

  </div>
</section>

<script src="script.js"></script>
</body>
</html>
